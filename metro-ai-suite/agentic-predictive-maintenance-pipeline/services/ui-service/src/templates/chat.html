<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ask &amp; Analyze — {{ use_case_id }}</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="/static/js/theme.js"></script>
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>Agentic Predictive Maintenance</h1>
      <div class="header-actions">
        <button id="themeToggle" class="icon-button" type="button" aria-label="Toggle light/dark theme" title="Toggle light/dark theme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <nav aria-label="Primary navigation">
    <a href="/">Dashboard</a>
    <a href="/detections">Detections</a>
    <a href="/chat" class="active" aria-current="page">Ask &amp; Analyze</a>
  </nav>

  <main class="chat-page">
    <section class="card chat-settings-card" aria-label="Conversation settings">
      <div class="chat-controls">
        <div class="mode-field">
          <span class="mode-field-label">Answer mode</span>
          <div class="mode-options" role="radiogroup" aria-label="Answer mode">
            <label><input type="radio" name="chat-mode" value="analysis" checked> Analysis</label>
            <label><input type="radio" name="chat-mode" value="detections"> Detections</label>
            <label><input type="radio" name="chat-mode" value="combined"> Combined</label>
          </div>
        </div>
        <label class="run-id-field" for="chat-run-id">
          Run scope <span>(optional)</span>
          <select id="chat-run-id">
            <option value="" id="chat-default-run-option">Latest completed run</option>
            {% for run in all_runs %}
            <option value="{{ run.run_id }}" {{ 'selected' if run.run_id == requested_run_id else '' }}>{{ run.run_id }} ({{ run.status }})</option>
            {% endfor %}
          </select>
        </label>
      </div>

      <div class="prompt-suggestions" aria-labelledby="suggestions-heading">
        <h3 id="suggestions-heading">Try asking</h3>
        <div class="prompt-list" id="prompt-list"></div>
      </div>
    </section>

    <section class="card chat-conversation-card" aria-label="Chat workspace">
      <div class="chat-conversation-heading">
        <h3>Conversation</h3>
        <button type="button" id="chat-clear" class="btn-danger btn-small">Clear chat</button>
      </div>
      <div id="chat-transcript" class="chat-transcript" role="log" aria-live="polite" aria-relevant="additions text" tabindex="0">
        <div class="chat-empty" id="chat-empty">
          <strong>Start a conversation</strong>
          <span>Choose a mode, then ask about your pipeline results.</span>
        </div>
        <div id="chat-thinking" class="chat-thinking" role="status" aria-label="Generating response" hidden>
          <span></span><span></span><span></span>
        </div>
      </div>

      <div id="chat-error" class="chat-error" role="alert" hidden>
        <span id="chat-error-text"></span>
        <button type="button" id="chat-retry" class="btn-secondary">Retry</button>
      </div>

      <form id="chat-form" class="chat-composer">
        <label for="chat-message">Your question</label>
        <div class="chat-compose-row">
          <textarea id="chat-message" name="message" rows="2" maxlength="4000" required
                    placeholder="Ask about maintenance risks, detections, or evidence…"></textarea>
          <button type="submit" id="chat-submit" class="btn-primary">Send</button>
        </div>
        <p class="chat-hint">Press Enter to send. Use Shift+Enter for a new line.</p>
        <p id="chat-status" class="sr-only" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer>
    <p>&#169; Intel Corporation — Agentic Predictive Maintenance Blueprint</p>
  </footer>
  <script src="/static/js/chat.js" defer></script>
</body>
</html>
